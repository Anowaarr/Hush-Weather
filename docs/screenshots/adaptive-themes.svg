<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <!-- Left: Deep Dark Sky Gradient -->
    <linearGradient id="splitDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1330" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Right: Crisp Light/Snow Mode Gradient -->
    <linearGradient id="splitLightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Dark Mode Range Bar -->
    <linearGradient id="rangeDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Light Mode Range Bar -->
    <linearGradient id="rangeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .font-split-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    .font-split-body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    .font-split-mono { font-family: "SF Mono", Menlo, Consolas, Monaco, monospace; }
  </style>

  <!-- Base Container -->
  <rect width="900" height="400" rx="20" fill="#020617" />

  <!-- LEFT HALF: Dark Mode -->
  <g transform="translate(0, 0)">
    <clipPath id="leftClip">
      <rect x="0" y="0" width="450" height="400" rx="20" />
    </clipPath>
    <rect width="450" height="400" fill="url(#splitDarkBg)" clip-path="url(#leftClip)" />

    <!-- Dark Mode Header Badge -->
    <g transform="translate(40, 32)">
      <rect width="180" height="30" rx="15" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8" />
      <text x="32" y="20" fill="#ffffff" class="font-split-title" font-size="12" letter-spacing="0.05em">DARK MODE (NIGHT/RAIN)</text>
    </g>

    <text x="40" y="90" fill="#ffffff" class="font-split-title" font-size="22">Deep Sky &amp; Luminous White Text</text>
    <text x="40" y="112" fill="rgba(255,255,255,0.7)" class="font-split-body" font-size="13">High-contrast frosted glass with glowing details</text>

    <!-- Dark Glass Card Preview -->
    <g transform="translate(40, 135)" filter="url(#cardShadow)">
      <rect width="370" height="225" rx="20" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.2" />
      
      <!-- Card Content -->
      <g transform="translate(24, 28)">
        <text x="0" y="0" fill="#ffffff" class="font-split-title" font-size="24">Reykjavík</text>
        <text x="0" y="20" fill="rgba(255,255,255,0.7)" class="font-split-body" font-size="13">Iceland · Night Sky</text>

        <text x="320" y="15" fill="#ffffff" class="font-split-title" font-size="44" font-weight="200" text-anchor="end">-2°</text>

        <!-- Condition -->
        <text x="0" y="55" fill="#38bdf8" class="font-split-body" font-size="14" font-weight="600">Clear Night · Twinkling Stars</text>
        <text x="0" y="74" fill="rgba(255,255,255,0.7)" class="font-split-body" font-size="12">H: 1°   L: -6°   Feels like -7°</text>

        <!-- Range Bar -->
        <g transform="translate(0, 95)">
          <text x="0" y="0" fill="#ffffff" class="font-split-body" font-size="12" font-weight="600">Today</text>
          <text x="60" y="0" fill="rgba(255,255,255,0.7)" class="font-split-mono" font-size="11">-6°</text>
          
          <rect x="90" y="-7" width="180" height="6" rx="3" fill="rgba(0,0,0,0.3)" />
          <rect x="110" y="-7" width="130" height="6" rx="3" fill="url(#rangeDark)" />
          <circle cx="160" cy="-4" r="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />

          <text x="285" y="0" fill="#ffffff" class="font-split-mono" font-size="11" font-weight="600">1°</text>
        </g>

        <!-- Pill metric -->
        <g transform="translate(0, 125)">
          <rect width="150" height="28" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.16)" />
          <text x="12" y="18" fill="#ffffff" class="font-split-body" font-size="11">💨 Wind: 24 km/h N</text>

          <rect x="162" y="0" width="150" height="28" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.16)" />
          <text x="174" y="18" fill="#ffffff" class="font-split-body" font-size="11">💧 Humidity: 82%</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="450" y1="0" x2="450" y2="400" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- RIGHT HALF: Light Mode (Snow / White / Fog / Daylight) -->
  <g transform="translate(450, 0)">
    <clipPath id="rightClip">
      <rect x="0" y="0" width="450" height="400" rx="20" />
    </clipPath>
    <rect width="450" height="400" fill="url(#splitLightBg)" clip-path="url(#rightClip)" />

    <!-- Light Mode Header Badge -->
    <g transform="translate(40, 32)">
      <rect width="190" height="30" rx="15" fill="rgba(15,23,42,0.08)" stroke="rgba(15,23,42,0.2)" />
      <circle cx="16" cy="15" r="5" fill="#f59e0b" />
      <text x="32" y="20" fill="#0f172a" class="font-split-title" font-size="12" letter-spacing="0.05em">LIGHT MODE (SNOW/FOG/AUTO)</text>
    </g>

    <text x="40" y="90" fill="#0f172a" class="font-split-title" font-size="22">Bright Snow &amp; Sharp Slate Black Text</text>
    <text x="40" y="112" fill="#475569" class="font-split-body" font-size="13">High-contrast solid borders with crisp readable dark glyphs</text>

    <!-- Light Glass Card Preview -->
    <g transform="translate(40, 135)" filter="url(#cardShadow)">
      <rect width="370" height="225" rx="20" fill="rgba(255, 255, 255, 0.85)" stroke="rgba(15, 23, 42, 0.18)" stroke-width="1.2" />
      
      <!-- Card Content -->
      <g transform="translate(24, 28)">
        <text x="0" y="0" fill="#0f172a" class="font-split-title" font-size="24">Oslo</text>
        <text x="0" y="20" fill="#475569" class="font-split-body" font-size="13">Norway · Winter Snow</text>

        <text x="320" y="15" fill="#0f172a" class="font-split-title" font-size="44" font-weight="200" text-anchor="end">-4°</text>

        <!-- Condition -->
        <text x="0" y="55" fill="#0284c7" class="font-split-body" font-size="14" font-weight="600">Heavy Snow · Zero Washout</text>
        <text x="0" y="74" fill="#475569" class="font-split-body" font-size="12">H: -1°   L: -8°   Feels like -9°</text>

        <!-- Range Bar -->
        <g transform="translate(0, 95)">
          <text x="0" y="0" fill="#0f172a" class="font-split-body" font-size="12" font-weight="600">Today</text>
          <text x="60" y="0" fill="#475569" class="font-split-mono" font-size="11">-8°</text>
          
          <rect x="90" y="-7" width="180" height="6" rx="3" fill="rgba(15,23,42,0.12)" />
          <rect x="110" y="-7" width="130" height="6" rx="3" fill="url(#rangeLight)" />
          <circle cx="150" cy="-4" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" />

          <text x="285" y="0" fill="#0f172a" class="font-split-mono" font-size="11" font-weight="600">-1°</text>
        </g>

        <!-- Pill metric -->
        <g transform="translate(0, 125)">
          <rect width="150" height="28" rx="8" fill="rgba(15,23,42,0.06)" stroke="rgba(15,23,42,0.14)" />
          <text x="12" y="18" fill="#0f172a" class="font-split-body" font-size="11">💨 Wind: 18 km/h NW</text>

          <rect x="162" y="0" width="150" height="28" rx="8" fill="rgba(15,23,42,0.06)" stroke="rgba(15,23,42,0.14)" />
          <text x="174" y="18" fill="#0f172a" class="font-split-body" font-size="11">❄️ Snow: 6.2 cm</text>
        </g>
      </g>
    </g>
  </g>
</svg>