<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Desktop Night Sky / Deep Space -->
    <linearGradient id="desktopBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glass Fill -->
    <linearGradient id="dGlassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.14)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <linearGradient id="dGlassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>

    <!-- Range Bar Gradient -->
    <linearGradient id="dRangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#4ade80" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Sun Arc Gradient -->
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2" />
    </linearGradient>

    <filter id="windowShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    .font-d-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    .font-d-body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-weight: 400; }
    .font-d-mono { font-family: "SF Mono", Menlo, Consolas, Monaco, monospace; }
  </style>

  <!-- Browser Window Wrapper -->
  <g filter="url(#windowShadow)">
    <rect x="20" y="15" width="920" height="550" rx="18" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  </g>

  <!-- Browser Window Header / Chrome -->
  <path d="M 20 33 A 18 18 0 0 1 38 15 L 922 15 A 18 18 0 0 1 940 33 L 940 52 L 20 52 Z" fill="#1e293b" />
  
  <!-- macOS Traffic Lights -->
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#eab308" />
  <circle cx="84" cy="34" r="6" fill="#22c55e" />

  <!-- App Header Title in Chrome -->
  <text x="480" y="38" fill="#94a3b8" class="font-d-body" font-size="12" font-weight="500" text-anchor="middle">Hush Weather — Desktop Dashboard (Widescreen)</text>

  <!-- Desktop App Canvas Viewport -->
  <g transform="translate(20, 52)">
    <rect width="920" height="513" fill="url(#desktopBg)" />

    <!-- 1. Top Desktop Navigation Bar -->
    <g transform="translate(30, 16)">
      <!-- Brand -->
      <g transform="translate(0, 4)">
        <circle cx="12" cy="12" r="8" fill="#f59e0b" />
        <path d="M 6 15 A 7 7 0 0 1 18 15 A 5 5 0 0 1 23 18 L 6 18 Z" fill="#60cdff" />
        <text x="32" y="17" fill="#ffffff" class="font-d-title" font-size="18">Hush</text>
        <rect x="80" y="4" width="54" height="18" rx="9" fill="rgba(96,205,255,0.15)" stroke="rgba(96,205,255,0.4)" />
        <text x="107" y="16" fill="#60cdff" class="font-d-body" font-size="9.5" font-weight="600" text-anchor="middle">Desktop</text>
      </g>

      <!-- Center Live Search Bar -->
      <g transform="translate(190, 0)">
        <rect width="360" height="34" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" />
        <circle cx="18" cy="17" r="5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.4" />
        <line x1="22" y1="21" x2="26" y2="25" stroke="rgba(255,255,255,0.5)" stroke-width="1.4" />
        <text x="36" y="21" fill="rgba(255,255,255,0.5)" class="font-d-body" font-size="12">Search any city, capital, or place...</text>
      </g>

      <!-- Right Action Buttons -->
      <g transform="translate(566, 0)">
        <!-- All Countries Directory -->
        <rect x="0" y="0" width="115" height="34" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.16)" />
        <text x="57" y="21" fill="#e2e8f0" class="font-d-body" font-size="12" font-weight="500" text-anchor="middle">🌍 All Countries</text>

        <!-- Fast Unit Switcher -->
        <rect x="125" y="0" width="64" height="34" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.12)" />
        <rect x="127" y="2" width="30" height="30" rx="8" fill="rgba(255,255,255,0.25)" />
        <text x="142" y="21" fill="#ffffff" class="font-d-body" font-size="12" font-weight="600" text-anchor="middle">°C</text>
        <text x="174" y="21" fill="rgba(255,255,255,0.6)" class="font-d-body" font-size="12" text-anchor="middle">°F</text>

        <!-- Appearance Switcher (Auto/Light/Dark) -->
        <rect x="198" y="0" width="94" height="34" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.12)" />
        <rect x="200" y="2" width="30" height="30" rx="8" fill="rgba(255,255,255,0.25)" />
        <text x="215" y="21" fill="#ffffff" class="font-d-body" font-size="11" font-weight="600" text-anchor="middle">✨</text>
        <text x="246" y="21" fill="rgba(255,255,255,0.6)" class="font-d-body" font-size="11" text-anchor="middle">☀️</text>
        <text x="276" y="21" fill="rgba(255,255,255,0.6)" class="font-d-body" font-size="11" text-anchor="middle">🌙</text>
      </g>
    </g>

    <!-- 2. Desktop Quick Places Chips Bar -->
    <g transform="translate(30, 64)">
      <!-- Active Chip: Tokyo -->
      <rect x="0" y="0" width="105" height="26" rx="13" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.4)" />
      <circle cx="12" cy="13" r="3" fill="#34d399" />
      <text x="22" y="17" fill="#ffffff" class="font-d-body" font-size="11" font-weight="600">Tokyo (JP)</text>

      <!-- Other Chips -->
      <rect x="115" y="0" width="100" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" />
      <text x="165" y="17" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="11" text-anchor="middle">London (GB)</text>

      <rect x="225" y="0" width="112" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" />
      <text x="281" y="17" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="11" text-anchor="middle">New York (US)</text>

      <rect x="347" y="0" width="88" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" />
      <text x="391" y="17" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="11" text-anchor="middle">Paris (FR)</text>

      <rect x="445" y="0" width="96" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" />
      <text x="493" y="17" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="11" text-anchor="middle">Sydney (AU)</text>
    </g>

    <!-- 3. Dual-Column Desktop Dashboard -->
    <!-- LEFT COLUMN: Hero + Hourly Strip + 10-Day Forecast -->
    <g transform="translate(30, 102)">
      <!-- Mini Hero Box -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="415" height="105" rx="18" fill="url(#dGlassFill)" stroke="url(#dGlassStroke)" />
        <g transform="translate(20, 24)">
          <!-- Pulsing destination clock -->
          <rect x="0" y="0" width="125" height="20" rx="10" fill="rgba(15,23,42,0.4)" stroke="rgba(255,255,255,0.14)" />
          <circle cx="10" cy="10" r="3" fill="#34d399" />
          <text x="20" y="14" fill="#ffffff" class="font-d-mono" font-size="10" font-weight="600">14:32:05 JST</text>

          <text x="0" y="44" fill="#ffffff" class="font-d-title" font-size="24">Tokyo</text>
          <text x="0" y="58" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="12">Kanto, Japan</text>

          <text x="360" y="50" fill="#ffffff" class="font-d-title" font-size="52" font-weight="200" text-anchor="end">24°</text>
          <text x="360" y="66" fill="#38bdf8" class="font-d-body" font-size="12" font-weight="600" text-anchor="end">Partly Cloudy</text>
        </g>
      </g>

      <!-- Hourly Forecast Card -->
      <g transform="translate(0, 116)">
        <rect width="415" height="100" rx="18" fill="url(#dGlassFill)" stroke="url(#dGlassStroke)" />
        <text x="16" y="20" fill="rgba(255,255,255,0.7)" class="font-d-title" font-size="10" letter-spacing="0.05em">HOURLY FORECAST (NEXT 24H)</text>

        <!-- Strip items -->
        <g transform="translate(32, 40)" text-anchor="middle">
          <text x="0" y="0" fill="#ffffff" class="font-d-body" font-size="10" font-weight="600">Now</text>
          <circle cx="0" cy="16" r="5" fill="#facc15" />
          <text x="0" y="38" fill="#ffffff" class="font-d-title" font-size="13">24°</text>
        </g>

        <g transform="translate(100, 40)" text-anchor="middle">
          <text x="0" y="0" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="10">15:00</text>
          <circle cx="0" cy="16" r="5" fill="#facc15" />
          <text x="0" y="38" fill="#ffffff" class="font-d-title" font-size="13">24°</text>
        </g>

        <g transform="translate(170, 40)" text-anchor="middle">
          <text x="0" y="0" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="10">16:00</text>
          <circle cx="0" cy="12" r="4.5" fill="#93c5fd" />
          <text x="0" y="23" fill="#38bdf8" class="font-d-body" font-size="8.5" font-weight="700">30%</text>
          <text x="0" y="38" fill="#ffffff" class="font-d-title" font-size="13">23°</text>
        </g>

        <g transform="translate(245, 40)" text-anchor="middle">
          <text x="0" y="0" fill="#fdba74" class="font-d-body" font-size="10" font-weight="600">17:14</text>
          <text x="0" y="16" fill="#fb923c" class="font-d-body" font-size="13">🌇</text>
          <text x="0" y="38" fill="#fdba74" class="font-d-body" font-size="9.5" font-weight="600">Sunset</text>
        </g>

        <g transform="translate(320, 40)" text-anchor="middle">
          <text x="0" y="0" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="10">18:00</text>
          <circle cx="0" cy="16" r="5" fill="#cbd5e1" />
          <text x="0" y="38" fill="#ffffff" class="font-d-title" font-size="13">21°</text>
        </g>

        <g transform="translate(382, 40)" text-anchor="middle">
          <text x="0" y="0" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="10">19:00</text>
          <circle cx="0" cy="16" r="5" fill="#cbd5e1" />
          <text x="0" y="38" fill="#ffffff" class="font-d-title" font-size="13">20°</text>
        </g>
      </g>

      <!-- 10-Day Forecast Card -->
      <g transform="translate(0, 226)">
        <rect width="415" height="175" rx="18" fill="url(#dGlassFill)" stroke="url(#dGlassStroke)" />
        <text x="16" y="20" fill="rgba(255,255,255,0.7)" class="font-d-title" font-size="10" letter-spacing="0.05em">10-DAY FORECAST</text>

        <!-- 3 Rows -->
        <g transform="translate(16, 46)">
          <text x="0" y="0" fill="#ffffff" class="font-d-body" font-size="12" font-weight="600">Today</text>
          <circle cx="70" cy="-4" r="5" fill="#facc15" />
          <text x="105" y="0" fill="rgba(255,255,255,0.7)" class="font-d-mono" font-size="11">19°</text>
          
          <rect x="135" y="-6" width="195" height="5" rx="2.5" fill="rgba(0,0,0,0.25)" />
          <rect x="155" y="-6" width="155" height="5" rx="2.5" fill="url(#dRangeGrad)" />
          <circle cx="230" cy="-3.5" r="3.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />

          <text x="350" y="0" fill="#ffffff" class="font-d-mono" font-size="11" font-weight="600">28°</text>
        </g>

        <g transform="translate(16, 86)">
          <text x="0" y="0" fill="#ffffff" class="font-d-body" font-size="12">Mon</text>
          <text x="68" y="0" fill="#38bdf8" class="font-d-body" font-size="11">🌧️</text>
          <text x="105" y="0" fill="rgba(255,255,255,0.7)" class="font-d-mono" font-size="11">17°</text>
          
          <rect x="135" y="-6" width="195" height="5" rx="2.5" fill="rgba(0,0,0,0.25)" />
          <rect x="140" y="-6" width="130" height="5" rx="2.5" fill="url(#dRangeGrad)" />

          <text x="350" y="0" fill="#ffffff" class="font-d-mono" font-size="11" font-weight="600">24°</text>
        </g>

        <g transform="translate(16, 126)">
          <text x="0" y="0" fill="#ffffff" class="font-d-body" font-size="12">Tue</text>
          <circle cx="70" cy="-4" r="5" fill="#facc15" />
          <text x="105" y="0" fill="rgba(255,255,255,0.7)" class="font-d-mono" font-size="11">18°</text>
          
          <rect x="135" y="-6" width="195" height="5" rx="2.5" fill="rgba(0,0,0,0.25)" />
          <rect x="145" y="-6" width="150" height="5" rx="2.5" fill="url(#dRangeGrad)" />

          <text x="350" y="0" fill="#ffffff" class="font-d-mono" font-size="11" font-weight="600">26°</text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: 4 Detailed Metric Tiles (2x2 Grid) -->
    <g transform="translate(465, 102)">
      <!-- Tile 1: UV Index -->
      <g transform="translate(0, 0)">
        <rect width="210" height="190" rx="18" fill="url(#dGlassFill)" stroke="url(#dGlassStroke)" />
        <text x="16" y="24" fill="rgba(255,255,255,0.7)" class="font-d-title" font-size="10" letter-spacing="0.05em">☀️ UV INDEX</text>
        <text x="16" y="66" fill="#ffffff" class="font-d-title" font-size="34">4</text>
        <text x="16" y="90" fill="#facc15" class="font-d-body" font-size="14" font-weight="600">Moderate</text>

        <rect x="16" y="108" width="178" height="6" rx="3" fill="url(#dRangeGrad)" />
        <circle cx="85" cy="111" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />

        <text x="16" y="152" fill="rgba(255,255,255,0.65)" class="font-d-body" font-size="10.5">Moderate for the rest of</text>
        <text x="16" y="168" fill="rgba(255,255,255,0.65)" class="font-d-body" font-size="10.5">the day. Wear sunscreen.</text>
      </g>

      <!-- Tile 2: Wind Compass -->
      <g transform="translate(225, 0)">
        <rect width="200" height="190" rx="18" fill="url(#dGlassFill)" stroke="url(#dGlassStroke)" />
        <text x="16" y="24" fill="rgba(255,255,255,0.7)" class="font-d-title" font-size="10" letter-spacing="0.05em">💨 WIND</text>
        
        <text x="16" y="64" fill="#ffffff" class="font-d-title" font-size="28">14</text>
        <text x="56" y="64" fill="rgba(255,255,255,0.7)" class="font-d-body" font-size="12">km/h</text>
        <text x="16" y="86" fill="#ffffff" class="font-d-body" font-size="13" font-weight="600">NE · Gentle Breeze</text>

        <!-- Compass Graphic -->
        <g transform="translate(135, 68)">
          <circle cx="0" cy="0" r="28" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
          <text x="0" y="-17" fill="rgba(255,255,255,0.5)" class="font-d-body" font-size="8" font-weight="700" text-anchor="middle">N</text>
          <line x1="0" y1="0" x2="16" y2="-16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="0" cy="0" r="3" fill="#ffffff" />
        </g>

        <text x="16" y="152" fill="rgba(255,255,255,0.65)" class="font-d-body" font-size="10.5">Gusts up to 21 km/h.</text>
        <text x="16" y="168" fill="rgba(255,255,255,0.65)" class="font-d-body" font-size="10.5">Direction 45° Northeast.</text>
      </g>

      <!-- Tile 3: Sunset Arc -->
      <g transform="translate(0, 205)">
        <rect width="210" height="195" rx="18" fill="url(#dGlassFill)" stroke="url(#dGlassStroke)" />
        <text x="16" y="24" fill="rgba(255,255,255,0.7)" class="font-d-title" font-size="10" letter-spacing="0.05em">🌇 SUNSET</text>
        <text x="16" y="66" fill="#ffffff" class="font-d-title" font-size="32">17:14</text>

        <!-- Quadratic Arc SVG -->
        <g transform="translate(16, 75)">
          <line x1="0" y1="45" x2="178" y2="45" stroke="rgba(255,255,255,0.15)" stroke-dasharray="3,3" />
          <path d="M 10 45 Q 89 5 168 45" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" />
          <circle cx="135" cy="30" r="5" fill="#facc15" stroke="#ffffff" stroke-width="1.5" />
        </g>

        <text x="16" y="162" fill="rgba(255,255,255,0.65)" class="font-d-body" font-size="10.5">Sunrise was at 06:12</text>
        <text x="16" y="178" fill="rgba(255,255,255,0.65)" class="font-d-body" font-size="10.5">Daylight remaining: 2h 42m</text>
      </g>

      <!-- Tile 4: Humidity & Dew Point -->
      <g transform="translate(225, 205)">
        <rect width="200" height="195" rx="18" fill="url(#dGlassFill)" stroke="url(#dGlassStroke)" />
        <text x="16" y="24" fill="rgba(255,255,255,0.7)" class="font-d-title" font-size="10" letter-spacing="0.05em">💧 HUMIDITY</text>
        <text x="16" y="66" fill="#ffffff" class="font-d-title" font-size="34">58%</text>

        <g transform="translate(16, 85)">
          <rect width="168" height="34" rx="8" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.08)" />
          <text x="12" y="21" fill="rgba(255,255,255,0.75)" class="font-d-body" font-size="11">Dew point: 15°</text>
        </g>

        <text x="16" y="162" fill="rgba(255,255,255,0.65)" class="font-d-body" font-size="10.5">The dew point is 15°</text>
        <text x="16" y="178" fill="rgba(255,255,255,0.65)" class="font-d-body" font-size="10.5">right now. Comfortable.</text>
      </g>
    </g>
  </g>
</svg>